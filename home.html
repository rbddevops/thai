<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:#F6F0E6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2A1058 0%,#7A2A86 48%,#E2486F 82%,#FF8A5B 100%)}
.sun{position:absolute;left:50%;bottom:-120px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
  background:radial-gradient(circle,#FFE29A 0%,#FFB170 45%,rgba(255,138,91,0) 70%);opacity:.9;pointer-events:none}
.ring{position:absolute;left:50%;top:-140px;width:520px;height:520px;margin-left:-260px;border-radius:50%;
  border:1.5px solid rgba(246,240,230,.18);pointer-events:none}
.ring.r2{width:760px;height:760px;margin-left:-380px;top:-260px;border-color:rgba(246,240,230,.1)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.3;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#gate{position:relative;z-index:2;width:min(92vw,380px);text-align:center;padding:28px 22px}
.lotus{width:210px;height:auto;display:block;margin:0 auto 4px;opacity:.95}
.th{font-size:22px;letter-spacing:.04em;color:#FFE29A;margin:6px 0 2px;font-family:'Thonburi','Sukhumvit Set',Loma,sans-serif}
h1{font-size:34px;font-weight:300;margin:6px 0 6px;letter-spacing:-.01em}
h1 b{font-weight:800;background:linear-gradient(90deg,#FFE29A,#FF9A8B);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.88;margin:6px 0 22px;font-size:15px}
input{width:100%;font-size:28px;letter-spacing:.35em;text-align:center;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.35);
  background:rgba(14,10,40,.45);color:#fff;outline:none}
input:focus{border-color:#FFE29A}
button{margin-top:14px;width:100%;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:14px;color:#2A1058;
  background:linear-gradient(90deg,#FFE29A,#FF9A8B);cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:22px;margin-top:12px;color:#FFD3D3;font-size:14px}
#view{display:none;width:100%;max-width:520px;position:relative;z-index:2}
#view img{display:block;width:100%;height:auto}
#view small{display:block;text-align:center;padding:10px;opacity:.85;font-size:13px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pin){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.v)},key,b64(D.c));
  return new Blob([plain],{type:'image/jpeg'});
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  const pin=document.getElementById('pin').value.trim();
  if(!pin){err.textContent='Escriu el PIN.';return}
  if(!(window.crypto&&crypto.subtle)){err.textContent='Obre aquest enllaç amb https.';return}
  btn.disabled=true;err.textContent='Obrint…';
  try{
    const blob=await open(pin);
    document.getElementById('img').src=URL.createObjectURL(blob);
    document.getElementById('gate').style.display='none';
    document.querySelectorAll('.sun,.ring').forEach(x=>x.style.display='none');
    document.body.style.background='linear-gradient(#2A1058 50%,#FF8A5B 50%)';
    document.getElementById('view').style.display='block';
  }catch(_){err.textContent='PIN incorrecte. Torna-ho a provar.';btn.disabled=false;document.getElementById('pin').select()}
});
</script>
