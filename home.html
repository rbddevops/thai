<title>Sorpresa</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%;color:#F6F0E6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:linear-gradient(180deg,#2A1058 0%,#7A2A86 48%,#E2486F 82%,#FF8A5B 100%) fixed}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sun{position:absolute;left:50%;bottom:-18vmin;width:min(110vmin,520px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#FFE29A 0%,#FFB170 45%,rgba(255,138,91,0) 70%);opacity:.9}
.ring{position:absolute;left:50%;top:-22vmin;width:min(130vmin,560px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:1.5px solid rgba(246,240,230,.18)}
.ring.r2{width:min(190vmin,820px);top:-45vmin;border-color:rgba(246,240,230,.1)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.3;z-index:3;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#gate{position:relative;z-index:2;width:min(100%,380px);text-align:center;padding:clamp(16px,4vh,32px) 22px}
.lotus{width:clamp(120px,34vw,210px);height:auto;display:block;margin:0 auto 4px;opacity:.95}
.th{font-size:clamp(18px,5.4vw,22px);letter-spacing:.04em;color:#FFE29A;margin:6px 0 2px;font-family:'Thonburi','Sukhumvit Set',Loma,sans-serif}
h1{font-size:clamp(28px,9vw,36px);font-weight:300;margin:6px 0;letter-spacing:-.01em;line-height:1.1}
h1 b{font-weight:800;background:linear-gradient(90deg,#FFE29A,#FF9A8B);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.92;text-wrap:balance;margin:6px 0 clamp(14px,3vh,22px);font-size:clamp(14px,4vw,15.5px);line-height:1.4}
.pw{position:relative}
input{width:100%;font-size:clamp(22px,7vw,28px);letter-spacing:.3em;text-align:center;padding:14px 54px 14px 54px;border-radius:14px;
  border:1px solid rgba(255,255,255,.35);background:rgba(14,10,40,.5);color:#fff;outline:none;font-family:inherit;min-height:56px}
input[type=text]{letter-spacing:.22em}
input::placeholder{letter-spacing:.3em;color:rgba(255,255,255,.4)}
input:focus{border-color:#FFE29A}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:12px;margin:0;padding:0;
  background:transparent;color:#F6F0E6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.eye:active{background:rgba(255,255,255,.12)}
.eye svg{width:26px;height:26px}
.eye .off{display:none}
.eye.on .off{display:block}.eye.on .open{display:none}
button.go{margin-top:14px;width:100%;font-size:17px;font-weight:700;padding:15px;min-height:54px;border:0;border-radius:14px;color:#2A1058;
  background:linear-gradient(90deg,#FFE29A,#FF9A8B);cursor:pointer;font-family:inherit}
button.go:disabled{opacity:.6}
#err{min-height:22px;margin-top:12px;color:#FFD3D3;font-size:14px}
#view{display:none;width:100%;max-width:520px;position:relative;z-index:2}
#view img{display:block;width:100%;height:auto}
#view small{display:block;text-align:center;padding:10px;opacity:.85;font-size:13px}
@media (max-height:560px){.sun{opacity:.3;width:70vmin;bottom:-30vmin}.lotus{width:96px}.th{margin:2px 0}h1{font-size:26px}p{margin-bottom:10px}#gate{padding:10px 22px}}
@media (min-width:700px){body{background-attachment:fixed}}
</style></head><body>

async function open(pin){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.v)},key,b64(D.c));
  return new Blob([plain],{type:'image/jpeg'});
}
const pinEl=document.getElementById('pin'),eye=document.getElementById('eye');
eye.addEventListener('click',()=>{
  const show=pinEl.type==='password';
  pinEl.type=show?'text':'password';
  eye.classList.toggle('on',show);eye.setAttribute('aria-pressed',String(show));
  eye.setAttribute('aria-label',show?'Amaga el PIN':'Mostra el PIN');
  pinEl.focus();
});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  const pin=pinEl.value.trim();
  if(!pin){err.textContent='Escriu el PIN.';return}
  if(!(window.crypto&&crypto.subtle)){err.textContent='Obre aquest enllaç amb https.';return}
  btn.disabled=true;err.textContent='Obrint…';
  try{
    const blob=await open(pin);
    document.getElementById('img').src=URL.createObjectURL(blob);
    document.getElementById('gate').style.display='none';
    document.querySelector('.bg').style.display='none';
    document.documentElement.style.background='linear-gradient(180deg,#2A1058 0%,#7A2A86 48%,#E2486F 82%,#FF8A5B 100%) fixed';document.body.style.background='transparent';
    document.getElementById('view').style.display='block';
    window.scrollTo(0,0);
  }catch(_){err.textContent='PIN incorrecte. Torna-ho a provar.';btn.disabled=false;pinEl.select()}
});
