const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pin){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.v)},key,b64(D.c));
  return new Blob([plain],{type:'image/jpeg'});
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  const pin=document.getElementById('pin').value.trim();
  if(!pin){err.textContent='Escriu el PIN.';return}
  if(!(window.crypto&&crypto.subtle)){err.textContent='Obre aquest enllaç amb https (no és possible desxifrar sense connexió segura).';return}
  btn.disabled=true;err.textContent='Obrint…';
  try{
    const blob=await open(pin);
    document.getElementById('img').src=URL.createObjectURL(blob);
    document.getElementById('gate').style.display='none';document.body.style.background='linear-gradient(#2A1058 50%,#FF8A5B 50%)';
    document.getElementById('view').style.display='block';
  }catch(_){err.textContent='PIN incorrecte. Torna-ho a provar.';btn.disabled=false;document.getElementById('pin').select()}
});
</script>
